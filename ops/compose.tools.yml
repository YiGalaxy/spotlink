name: spotlink-next-tools
services:
  browser-tools:
    image: spotlink-next-browser:local
    build:
      context: .
      dockerfile: ops/docker/browser/Dockerfile
    working_dir: /workspace/.local/browser
    volumes: [".:/workspace:ro", "./.local:/workspace/.local"]
    environment:
      PLAYWRIGHT_CLI_SESSION: spotlink-auth-check
  data-tools:
    image: node:22.14.0-alpine
    working_dir: /workspace
    volumes: [".:/workspace:ro", "./.local:/workspace/.local"]
    command: ["node", "data/generators/generate.mjs"]
  backend-tools:
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /workspace/backend
    volumes: [".:/workspace", "spotlink_next_maven:/root/.m2"]
  frontend-tools:
    image: node:22.14.0-alpine
    working_dir: /workspace/frontend
    volumes: [".:/workspace", "spotlink_next_npm:/root/.npm", "spotlink_next_node_modules:/workspace/frontend/node_modules"]
volumes:
  spotlink_next_maven:
  spotlink_next_npm:
  spotlink_next_node_modules:
