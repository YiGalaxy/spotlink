server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: spotlink

  # Defaults to the local profile for developer machines; any other
  # environment must set SPRING_PROFILES_ACTIVE explicitly.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # allowPublicKeyRetrieval + useSSL=false are for local Docker only. MySQL 8
    # defaults to caching_sha2_password over TLS; a scratch container has no
    # certificate worth validating, and requiring one would make `docker compose
    # up` fail on a fresh machine for no security gain.
    #
    # connectionTimeZone=Asia/Shanghai with forceConnectionTimeZoneToSession
    # pins the JDBC session so a DATETIME written as OffsetDateTime comes back
    # the same instant it went in. MySQL has no timezone-aware type, so this
    # setting is what carries the meaning PostgreSQL kept in TIMESTAMPTZ.
    url: ${BULK_DB_URL:jdbc:mysql://localhost:13306/bulk_trade?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true}
    username: ${BULK_DB_USER:bulk}
    # The default matches the container in docker-compose.yml and is for local
    # development. Any deployment reachable from outside this machine must set
    # it: a committed password is a published password, and the whole point of
    # reading it here is that changing it is configuration rather than an edit
    # to a file that is already in the repository.
    password: ${BULK_DB_PASSWORD:bulk_trade_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: SpotlinkHikari

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${BULK_REDIS_HOST:localhost}
      port: ${BULK_REDIS_PORT:16379}
      # Same reasoning as the database password above.
      password: ${BULK_REDIS_PASSWORD:bulk_trade_2026}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  ai:
    anthropic:
      # Auto-configuration requires a non-empty key at startup. A placeholder
      # keeps the platform bootable without an advisor key; the advisor reports
      # itself unavailable instead of the whole application refusing to start.
      api-key: ${BULK_ADVISOR_API_KEY:not-configured}
      base-url: ${BULK_ADVISOR_BASE_URL:https://api.anthropic.com}
      chat:
        model: ${BULK_ADVISOR_MODEL:claude-opus-5}
        max-tokens: 8192
        cache-options:
          # Cache the system prompt. The stable half of it is identical for
          # every tenant, so one cache entry serves all callers.
          strategy: SYSTEM_ONLY
          # Send each system message as its own block. Without this the stable
          # and caller-specific halves are merged and the prefix changes per
          # user, which misses the cache on every request.
          multi-block-system-caching: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Application-specific settings
bulk:
  security:
    jwt:
      # Base64-encoded 256-bit secret. Override in every non-local environment.
      secret: ${BULK_JWT_SECRET:YnVsay10cmFkZS1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtMjAyNg==}
      access-token-ttl: 2h
      refresh-token-ttl: 7d

  init:
    # Seeds development accounts (admin / seller01 / buyer01 / pending01).
    # MUST be false in any environment real users can reach.
    enabled: true

  trading:
    # How often the background sweep runs. It answers acceptances whose lister
    # never replied, and expires listings past their validity — the work nobody
    # triggers by hand, so this interval bounds how long a stalled offer sits.
    sweep-interval-ms: 300000
    # Let the application finish starting before the first sweep.
    sweep-initial-delay-ms: 60000
    # How long a lister has to answer an acceptance on a 「需挂牌方确认」 listing.
    # Capped by each listing's own validity, so it can only ever shorten the
    # wait. Set this to PT1M to watch the auto-expiry path without waiting a day.
    confirm-window: ${BULK_CONFIRM_WINDOW:PT24H}

  rag:
    embedding:
      # Claude has no embedding endpoint, so this is the one non-Anthropic
      # piece of the advisor stack. BGE-M3 served by Ollama: strong in Chinese,
      # free per call, and runs without network access.
      enabled: ${BULK_EMBEDDING_ENABLED:true}
      base-url: ${BULK_EMBEDDING_URL:http://localhost:11434}
      model: ${BULK_EMBEDDING_MODEL:bge-m3}

  advisor:
    enabled: true
    # Upper bound on agent-loop iterations. A tool-calling loop with no ceiling
    # can spin forever, and every turn is billed.
    max-iterations: 8
    # Endpoint, key, model and token ceiling live under spring.ai.anthropic so
    # there is exactly one place to configure the model connection.

logging:
  level:
    root: info
    com.bulk.trade: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
