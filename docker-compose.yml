name: spotlink

# Infrastructure for the bulk commodity spot trading platform.
# Ports are intentionally non-default to avoid clashing with a local database
# service and other Docker containers already on this machine.
#   MySQL -> 13306
#   Redis -> 16379

services:
  mysql:
    # 8.4 is the current LTS, chosen over 9.x deliberately: 9.x adds a native
    # VECTOR type, but it is new enough to be absent from most production
    # environments, and a portfolio project should run on the version the people
    # reading it actually deploy.
    #
    # Without a vector type the knowledge base computes cosine similarity in
    # Java over the chunk table. That is a full scan: free at eleven passages,
    # untenable at ten thousand. The trade is recorded in the README rather than
    # hidden.
    image: mysql:8.4
    container_name: spotlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bulk_trade
      MYSQL_USER: bulk
      # Local development only. These are reachable from the host on a
      # non-default port and nowhere else, and they are committed on purpose:
      # a clone has to come up with one command, and a password that is
      # generated per machine is a step somebody has to document.
      #
      # Anything reachable from outside this machine needs these from the
      # environment instead — the JDBC URL in application.yml already reads
      # its own from BULK_* variables, and these should follow it.
      MYSQL_PASSWORD: bulk_trade_2026
      MYSQL_ROOT_PASSWORD: bulk_root_2026
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "bulk", "-pbulk_trade_2026"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    command:
      # utf8mb4 throughout with a collation that sorts Chinese sensibly. The 8.4
      # default is already utf8mb4; stating it is what stops a container built
      # elsewhere from silently differing.
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      # Creating a TRIGGER as a non-SUPER user while binary logging is on
      # requires this. The alternative is running the application as root,
      # which is a worse answer to the same problem.
      - "--log-bin-trust-function-creators=1"
      - "--max-connections=200"
      - "--slow-query-log=1"
      - "--long-query-time=0.5"
      # Stored timestamps are UTC by convention; this only affects NOW() in
      # ad-hoc sessions.
      - "--default-time-zone=+08:00"

  redis:
    image: redis:7-alpine
    container_name: spotlink-redis
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "bulk_trade_2026"
    ports:
      - "16379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "bulk_trade_2026", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

# Volume names keep their original prefix on purpose. Renaming them would make
# Docker create empty volumes and the existing data would appear to vanish - the
# name is the volume's identity, not a label. Rename only alongside a
# dump-and-restore.
#
# `mysqldata` is new because this is a different engine and there is nothing to
# carry over. The PostgreSQL volume is deliberately left in place rather than
# deleted, so the previous dataset survives until someone removes it on purpose.
volumes:
  mysqldata:
    name: bulk-trade-mysqldata
  redisdata:
    name: bulk-trade-redisdata
