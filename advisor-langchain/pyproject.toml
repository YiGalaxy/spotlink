[project]
name = "spotlink-advisor-langchain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain==1.0.8",
  "langchain-openai==1.0.3",
  "fastapi==0.121.1",
  "uvicorn==0.38.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
  "jsonschema==4.25.1",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.3.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
